# Regenerate with: dart run flutter_launcher_icons
# The sources in assets/icon are the package logo rendered at 1024 px.
flutter_launcher_icons:
  android: true
  image_path_android: "assets/icon/icon.png"
  adaptive_icon_background: "#141118"
  # The foreground already keeps the mark inside Android's safe zone.
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#141118"
  windows:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon_macos.png"
