name: flutter_carousel_widget
description: A carousel for Flutter with ten composable effects, autoplay, indicators, content-sized pages, keyboard navigation and screen-reader support, on widgets.dart alone.
version: 4.0.1
homepage: https://nixrajput.github.io/flutter_carousel_widget
repository: https://github.com/nixrajput/flutter_carousel_widget
issue_tracker: https://github.com/nixrajput/flutter_carousel_widget/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10

topics:
  - carousel
  - slider
  - page-view
  - animation
  - accessibility

funding:
