name: Bug Report
description: File a bug report for flutter_carousel_widget
title: "[Bug]: "
labels: ["bug"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please check the [existing issues](https://github.com/nixrajput/flutter_carousel_widget/issues) to avoid duplicates. Upgrading from 3.x? [MIGRATION.md](https://github.com/nixrajput/flutter_carousel_widget/blob/master/MIGRATION.md) maps every renamed option.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of flutter_carousel_widget is affected?
      multiple: false
      options:
        - FlutterCarousel
        - ExpandableCarousel (height follows the item)
        - Controller (FlutterCarouselController)
        - Indicators
        - Effects
        - Autoplay
        - Scrolling and snapping (infinite, padEnds, flush edges, physics)
        - Keyboard / screen readers
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see, and what did you expect?
      placeholder: "Expected: ... Actual: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest carousel that shows the bug, plus what you did with it. Smaller repros get fixed faster.
      placeholder: |
        1. Build `FlutterCarousel(height: 200, infinite: true, items: [...])`
        2. Swipe past the last item
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: flutter_carousel_widget version
      description: The version you are running.
      placeholder: "e.g. 4.0.0"
    validations:
      required: true

  - type: textarea
    id: flutter
    attributes:
      label: Flutter version
      description: Output of `flutter --version`.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where do you see the bug?
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the error or stack trace. Formatted as code.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/flutter_carousel_widget/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
